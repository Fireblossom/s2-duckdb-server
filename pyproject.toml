[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2-duckdb-server"
version = "0.1.0"
description = "Download the Semantic Scholar Academic Graph, build DuckDB caches and serve SQL over HTTP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Changxu Duan" }]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=14",
    "pandas>=2.0",
    "requests>=2.28",
    "tqdm",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
s2db = "s2duckdb.cli:main"

[project.urls]
Repository = "https://github.com/Fireblossom/s2-duckdb-server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
